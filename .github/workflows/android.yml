
name: Build YAZID VPN APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout YAZID workflow
        uses: actions/checkout@v4

      - name: Get maintained Xray Android client
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/2dust/v2rayNG.git upstream

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.1 build-tools;37.0.0 platform-tools'

      - name: Install NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=0 --install "ndk;30.0.16248370"
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
          sed -i '/^android {/a\    ndkVersion = "30.0.16248370"' upstream/V2rayNG/app/build.gradle.kts

      - name: Build native tunnel library
        working-directory: upstream
        run: bash compile-hevtun.sh

      - name: Copy native libraries
        run: |
          mkdir -p upstream/V2rayNG/app/libs
          cp -a upstream/libs/. upstream/V2rayNG/app/libs/

      - name: Find Xray core release
        run: |
          cd upstream/AndroidLibXrayLite
          git fetch --tags
          CURRENT_TAG="$(git describe --tags --abbrev=0)"
          echo "XRAY_TAG=$CURRENT_TAG" >> "$GITHUB_ENV"
          echo "Using Xray library release $CURRENT_TAG"

      - name: Download Xray Android library
        uses: robinraju/release-downloader@v1.13
        with:
          repository: '2dust/AndroidLibXrayLite'
          tag: ${{ env.XRAY_TAG }}
          fileName: 'libv2ray.aar'
          out-file-path: upstream/V2rayNG/app/libs/

      - name: Apply YAZID VPN branding
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path("upstream/V2rayNG")
          app = root / "app"

          gradle = app / "build.gradle.kts"
          s = gradle.read_text()
          s, n = re.subn(
              r'applicationId\s*=\s*"[^"]+"',
              'applicationId = "com.yazid.vpn"',
              s,
              count=1
          )
          if n != 1:
              raise SystemExit("Could not update applicationId")
          gradle.write_text(s)

          res = app / "src/main/res"
          for p in res.glob("values*/strings.xml"):
              s = p.read_text()
              for key, value in (
                  ("app_name", "YAZID VPN"),
                  ("app_tile_name", "YAZID VPN"),
                  ("notification_channel_service", "YAZID VPN")
              ):
                  pattern = rf'(<string\s+name="{key}"[^>]*>).*?(</string>)'
                  s, count = re.subn(
                      pattern,
                      rf'\g<1>{value}\g<2>',
                      s,
                      count=1,
                      flags=re.S
                  )
                  if key == "app_name" and count == 0 and p.parent.name == "values":
                      s = s.replace(
                          "</resources>",
                          f'<string name="app_name" translatable="false">{value}</string>\n</resources>'
                      )
              p.write_text(s)

          manifest = app / "src/main/AndroidManifest.xml"
          s = manifest.read_text()
          s = re.sub(
              r'android:icon="@mipmap/ic_launcher"',
              'android:icon="@drawable/ic_yazid_launcher"',
              s,
              count=1
          )
          if 'android:roundIcon=' in s:
              s = re.sub(
                  r'android:roundIcon="[^"]*"',
                  'android:roundIcon="@drawable/ic_yazid_launcher"',
                  s,
                  count=1
              )
          manifest.write_text(s)

          drawable = res / "drawable"
          drawable.mkdir(parents=True, exist_ok=True)
          (drawable / "ic_yazid_launcher.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#160B2B" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#8B5CF6" android:pathData="M54,9 L88,22 L86,55 C84,76 70,91 54,100 C38,91 24,76 22,55 L20,22 Z"/>
              <path android:fillColor="#F4EFFF" android:pathData="M35,34 L47,34 L54,48 L61,34 L73,34 L60,56 L60,76 L48,76 L48,56 Z"/>
          </vector>
          """)

          app_config = app / "src/main/java/com/v2ray/ang/AppConfig.kt"
          s = app_config.read_text()
          s = s.replace(
              'const val APP_URL = "$GITHUB_URL/2dust/v2rayNG"',
              'const val APP_URL = "https://github.com/mimi12356mimi-sudo/YAZID-VPN"'
          )
          s = s.replace(
              'const val APP_API_URL = "https://api.github.com/repos/2dust/v2rayNG/releases"',
              'const val APP_API_URL = "https://api.github.com/repos/mimi12356mimi-sudo/YAZID-VPN/releases"'
          )
          s = s.replace(
              'const val TG_CHANNEL_URL = "https://t.me/github_2dust"',
              'const val TG_CHANNEL_URL = "https://t.me/YazidSup"'
          )
          s = s.replace(
              'const val APP_PROMOTION_URL = "aHR0cHM6Ly85LjIzNDQ1Ni54eXovYWJjLmh0bWw="',
              'const val APP_PROMOTION_URL = "aHR0cHM6Ly90Lm1lL1lhemlkU3Vw"'
          )
          app_config.write_text(s)

          theme = app / "src/main/java/com/v2ray/ang/ui/compose/Theme.kt"
          s = theme.read_text()
          replacements = {
              "Color(0xFFC0C0C0)": "Color(0xFFB78CFF)",
              "Color(0xFF303030)": "Color(0xFF24123D)",
              "Color(0xFF474747)": "Color(0xFF55318A)",
              "Color(0xFFf97910)": "Color(0xFF8B5CF6)",
              "Color(0xFF4E2600)": "Color(0xFF24123D)",
              "Color(0xFF6F3800)": "Color(0xFF382253)",
              "Color(0xFFFFE8D6)": "Color(0xFFF4EFFF)",
              "Color(0xFF1C1B1F)": "Color(0xFF0B0911)",
              "Color(0xFFE6E1E5)": "Color(0xFFF7F1FF)",
              "Color(0xFF49454F)": "Color(0xFF241D31)",
              "Color(0xFF938F99)": "Color(0xFF8B5CF6)"
          }
          for old, new in replacements.items():
              s = s.replace(old, new)

          s = s.replace(
              'MmkvManager.decodeSettingsString(AppConfig.PREF_UI_MODE_NIGHT, "0")',
              'MmkvManager.decodeSettingsString(AppConfig.PREF_UI_MODE_NIGHT, "2")'
          )
          s = s.replace(
              'MmkvManager.decodeSettingsBool(AppConfig.PREF_DYNAMIC_COLOR, true)',
              'MmkvManager.decodeSettingsBool(AppConfig.PREF_DYNAMIC_COLOR, false)'
          )
          theme.write_text(s)

          print("YAZID VPN branding applied")
          PY

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build YAZID VPN
        working-directory: upstream/V2rayNG
        run: |
          chmod +x gradlew
          ./gradlew :app:assemblePlaystoreDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          APK_PATH="$(find upstream/V2rayNG/app/build/outputs/apk/playstore/debug -type f -name '*universal*.apk' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            APK_PATH="$(find upstream/V2rayNG/app/build/outputs/apk/playstore/debug -type f -name '*.apk' | head -n 1)"
          fi
          if [ -z "$APK_PATH" ]; then
            echo "APK not found"
            exit 1
          fi
          cp "$APK_PATH" "$GITHUB_WORKSPACE/YAZID-VPN.apk"
          ls -lh "$GITHUB_WORKSPACE/YAZID-VPN.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YAZID-VPN-debug-APK
          path: YAZID-VPN.apk
          if-no-files-found: error
