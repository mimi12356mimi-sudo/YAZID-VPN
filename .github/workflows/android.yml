
name: Build YAZID VPN APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'YAZID-VPN-starter.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -q YAZID-VPN-starter.zip -d extracted
          SETTINGS_FILE="$(find extracted \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Gradle settings file not found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS_FILE")" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YAZID-VPN-debug-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
