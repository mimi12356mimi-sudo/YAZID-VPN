name: Build YAZID VPN APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'YAZID-VPN-starter.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -q YAZID-VPN-starter.zip -d extracted
          SETTINGS_FILE="$(find extracted \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Gradle settings file not found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS_FILE")" >> "$GITHUB_ENV"

      - name: Fix Java and Kotlin targets
        run: |
          python3 - "$PROJECT_DIR/app/build.gradle.kts" <<'PY'
          import pathlib, re, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()

          s = re.sub(r'^\s*outputFileName\s*=.*\n', '', s, flags=re.M)

          block = """    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }"""

          if re.search(r'compileOptions\s*\{', s):
              s, n = re.subn(
                  r'compileOptions\s*\{.*?\}',
                  lambda m: block,
                  s,
                  count=1,
                  flags=re.S
              )
          else:
              s, n = re.subn(
                  r'android\s*\{',
                  lambda m: m.group(0) + "\n" + block,
                  s,
                  count=1
              )

          if not n:
              raise SystemExit("Could not find android block")

          p.write_text(s)
          print("Gradle configuration fixed")
          PY

      - name: Apply YAZID VPN branding
        run: |
          python3 - "$PROJECT_DIR" <<'PY'
          import pathlib, re, sys
          import xml.etree.ElementTree as ET

          root = pathlib.Path(sys.argv[1])
          app = root / "app"

          manifest = app / "src/main/AndroidManifest.xml"
          if not manifest.exists():
              raise SystemExit("AndroidManifest.xml not found")

          s = manifest.read_text()
          m = re.search(r'<application\b[^>]*>', s)
          if not m:
              raise SystemExit("Application tag not found")

          tag = m.group(0)
          attrs = {
              "android:label": "@string/app_name",
              "android:icon": "@drawable/ic_yazid_launcher",
              "android:roundIcon": "@drawable/ic_yazid_launcher"
          }

          for key, value in attrs.items():
              pattern = r'\s' + re.escape(key) + r'="[^"]*"'
              if re.search(pattern, tag):
                  tag = re.sub(pattern, ' ' + key + '="' + value + '"', tag)
              else:
                  tag = tag[:-1] + ' ' + key + '="' + value + '">'

          manifest.write_text(s[:m.start()] + tag + s[m.end():])

          values = app / "src/main/res/values"
          values.mkdir(parents=True, exist_ok=True)
          strings = values / "strings.xml"

          if strings.exists():
              tree = ET.parse(strings)
              resources = tree.getroot()
          else:
              resources = ET.Element("resources")
              tree = ET.ElementTree(resources)

          app_name = resources.find("string[@name='app_name']")
          if app_name is None:
              app_name = ET.SubElement(resources, "string", {"name": "app_name"})

          app_name.text = "YAZID VPN"
          tree.write(strings, encoding="utf-8", xml_declaration=True)

          drawable = app / "src/main/res/drawable"
          drawable.mkdir(parents=True, exist_ok=True)

          icon = """<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#160B2B"
                  android:pathData="M0,0h108v108h-108z"/>
              <path
                  android:fillColor="#8B5CF6"
                  android:pathData="M54,9 L88,22 L86,55 C84,76 70,91 54,100 C38,91 24,76 22,55 L20,22 Z"/>
              <path
                  android:fillColor="#F4EFFF"
                  android:pathData="M35,34 L47,34 L54,48 L61,34 L73,34 L60,56 L60,76 L48,76 L48,56 Z"/>
          </vector>
          """

          (drawable / "ic_yazid_launcher.xml").write_text(icon)
          print("YAZID VPN name and launcher icon applied")
          PY

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --stacktrace

      - name: Rename APK
        run: |
          APK_PATH="$(find "$PROJECT_DIR" -path '*/build/outputs/apk/debug/*.apk' -type f | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "APK file not found"
            exit 1
          fi
          cp "$APK_PATH" "$GITHUB_WORKSPACE/YAZID-VPN.apk"
          echo "APK renamed successfully"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YAZID-VPN-debug-APK
          path: YAZID-VPN.apk
          if-no-files-found: error
